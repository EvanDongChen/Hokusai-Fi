<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wave lines</title>
  <style>
    body { margin: 0; background: #2a2420; color: #eee; font: 14px system-ui, sans-serif; }
    header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; }
    input { font: inherit; padding: 4px 8px; width: 14em; }
    button, label { font: inherit; }
    main { padding: 0 14px 14px; }
    canvas { width: 100%; height: auto; display: block; background: #f3ebd6; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid figure { margin: 0; }
    .grid figcaption { font-size: 12px; opacity: 0.7; padding: 2px 0; }
  </style>
</head>
<body>
  <header>
    <input id="seed" aria-label="Seed" />
    <button id="new">New seed</button>
    <button id="grid">Grid of 6</button>
    <label><input type="checkbox" id="layers" /> Tint layers</label>
  </header>
  <main id="main"></main>
  <script type="module">
    import { generate, draw, W, H } from './src/lines/waves';
    const q = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    const words = ['salt', 'crane', 'tide', 'oar', 'gull', 'reef', 'foam', 'pine', 'moon', 'spray'];
    const rand = () => `${words[Math.floor(Math.random() * words.length)]}-${Math.floor(Math.random() * 999)}`;
    const sheet = (seed, scale) => {
      const c = document.createElement('canvas');
      c.width = Math.round(W * scale); c.height = Math.round(H * scale);
      const ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      draw(ctx, generate(seed), { layers: $('layers').checked });
      return c;
    };
    function render() {
      const main = $('main'), seed = $('seed').value;
      main.innerHTML = '';
      if (q.get('grid') === '1') {
        main.className = 'grid';
        for (let i = 0; i < 6; i++) {
          const s = i === 0 ? seed : `${seed}-${i}`, f = document.createElement('figure');
          f.append(sheet(s, 0.6));
          const cap = document.createElement('figcaption'); cap.textContent = s; f.append(cap);
          main.append(f);
        }
      } else {
        main.className = '';
        main.append(sheet(seed, 1.5));
      }
      q.set('seed', seed);
      history.replaceState(null, '', `?${q}`);
      document.title = 'done';
    }
    $('seed').value = q.get('seed') ?? rand();
    $('seed').addEventListener('change', render);
    $('new').onclick = () => { $('seed').value = rand(); render(); };
    $('grid').onclick = () => { q.set('grid', q.get('grid') === '1' ? '0' : '1'); render(); };
    $('layers').checked = q.get('layers') === '1';
    $('layers').onchange = () => { q.set('layers', $('layers').checked ? '1' : '0'); render(); };
    render();
  </script>
</body>
</html>
